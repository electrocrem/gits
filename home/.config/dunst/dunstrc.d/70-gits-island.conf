# The dynamic island (gits-island): low / normal notifications show in the middle of the bar instead of as popups. Off here;
# island.py switches the two rules on while it runs (`dunstctl rule NAME enable`) and off when it stops, so without the island
# dunst works as before. Skipped ones still land in the history (Super+N / the bell). Critical messages stay popups.
[gits-island-low]
    msg_urgency = low
    skip_display = yes
    script = @HOME@/.config/dunst/gits-island.sh
    enabled = false

[gits-island-normal]
    msg_urgency = normal
    skip_display = yes
    script = @HOME@/.config/dunst/gits-island.sh
    enabled = false

# messages with buttons that a tool waits for (notify-send -A ... --wait) must stay popups: a skipped one counts as closed at once.
# Our tools mark them with a stack tag "gits-ask-..."; the script skips them too.
[gits-island-keep]
    stack_tag = "^gits-ask"
    skip_display = no
