# The battery reports "Not charging" / "Full" around 98% (asusctl's charge limit is 100%) and its status flaps Full / Not charging / Discharging, so HyDE's battery
# notifier keeps posting "Battery Full" (critical!) and phantom "Charger Plug Out". Hidden and kept out of the history
# (the waybar counter reads it). Real warnings (Battery Low, Critically Low) are untouched; plug sounds come from gits-events.sh.
[gits-battery-noise]
    appname = "HyDE Power"
    summary = "^(Battery Full|Charger Plug (In|Out))$"
    skip_display = yes
    history_ignore = yes
