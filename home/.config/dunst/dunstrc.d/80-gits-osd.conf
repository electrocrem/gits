# HyDE's volume / brightness / mute popups ("46....", "82..", "muted", "unmuted"; app "HyDE Notify") become the GitS
# on-screen display (gits-osd, bottom centre). Other "HyDE Notify" popups (night light, ...) are left alone.
[gits-osd]
    appname = "HyDE Notify"
    summary = "^([0-9]+[.]*|muted|unmuted)$"
    skip_display = yes
    history_ignore = yes
    script = @HOME@/.config/dunst/gits-osd.sh

# Keyboard backlight popups from whatever sends them (asusd / ROG Control Center): the OSD daemon watches the LED in
# sysfs itself, so these are hidden. Only the summary is matched.
[gits-osd-kbd]
    summary = "([Kk]eyboard|[Kk]bd|[Bb]acklight)"
    skip_display = yes
    history_ignore = yes
