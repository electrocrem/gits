# KDE Connect mirrors phone notifications with HTML-escaped markup that dunst prints literally, and a chat burst used
# to pile up over the desktop widgets. The original is hidden and gits-phone-notify.sh shows a clean, short copy.
[gits-kdeconnect]
    appname = "KDE Connect"
    skip_display = yes
    script = @HOME@/.config/dunst/gits-phone-notify.sh
