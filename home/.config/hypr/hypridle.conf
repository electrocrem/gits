# hypridle: what happens when the machine is left alone. The four timers (dim, lock, screen off, sleep) between the gits-idle markers
# are written by `gits-idle` (Super+I -> Sleep and power timers), one set for AC power and one for battery; the rest is yours.

general {
    # `loginctl lock-session` (also Super+L, and the lock timer). hyprlock gets its own scope: a child of hypridle lives in
    # gits-idle.service, and `gits-idle apply` restarts that service on every plug / unplug, which killed the lock screen
    # ("lockscreen app died") whenever the charger was plugged in while locked
    lock_cmd = pidof hyprlock || systemd-run --user --scope --collect -q hyprlock
    unlock_cmd = pkill -USR1 hyprlock               # `loginctl unlock-session`
    ignore_dbus_inhibit = false                     # a video player or a call keeps the screen awake
    ignore_systemd_inhibit = false
    # before_sleep_cmd = loginctl lock-session      # lock before a manual suspend too
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

