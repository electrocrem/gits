# Ghost in the Shell lock screen: HUD column on the left, the wallpaper stays untouched on the right. Alive: a hologram Lain dances at the right
# edge (text frames), the clock glitches now and then (with a red colour-split ghost), the prompt has a blinking cursor, a scanner runs along the line.
# The plain version is hyprlock/static.conf (copy it over this file to get it back).
# Started by hypridle (lock_cmd), Super+L and `loginctl lock-session`.

$BATTERY_ICON = gits-battery icon

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = spring, 0.34, 1.56, 0.64, 1
    bezier = quint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, quint
    animation = fadeOut, 1, 4, quint
    animation = inputField, 1, 5, spring
    animation = inputFieldWidth, 1, 6, spring
    animation = inputFieldDots, 1, 3, spring
    animation = inputFieldFade, 1, 4, quint
    animation = inputFieldColors, 1, 3, quint
}

$hud = JetBrainsMono Nerd Font
$cjk = Noto Sans CJK JP
$cyan = rgba(46, 211, 215, 1.0)
$cyan_dim = rgba(46, 211, 215, 0.55)
$navy = rgba(6, 10, 20, 0.72)
$red = rgba(229, 67, 43, 1.0)
$orange = rgba(255, 122, 92, 1.0)

background {
    monitor =
    color = rgba(6, 10, 20, 1.0)
    path = @HOME@/.config/hypr/hyprlock/gits_lock_bg.png # fixed lock-screen picture, does not follow the desktop wallpaper
    blur_size = 2
    blur_passes = 0 # keep the picture sharp
    noise = 0.02
    contrast = 1.0
    brightness = 0.95
    vibrancy = 0.0
    vibrancy_darkness = 0.0
    zindex = 1
}

# ── corner brackets ─────────────────────────────────────────────
label {
    monitor =
    text = ┏
    color = $cyan
    font_size = 54
    font_family = $hud
    position = 24, -20
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = ┓
    color = $cyan
    font_size = 54
    font_family = $hud
    position = -24, -20
    halign = right
    valign = top
    zindex = 2
}
label {
    monitor =
    text = ┗
    color = $cyan
    font_size = 54
    font_family = $hud
    position = 24, 20
    halign = left
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = ┛
    color = $cyan
    font_size = 54
    font_family = $hud
    position = -24, 20
    halign = right
    valign = bottom
    zindex = 2
}

# ── top strip ───────────────────────────────────────────────────
label {
    monitor =
    text = 公安9課  //  SECTION 9
    color = $cyan
    font_size = 15
    font_family = $cjk
    position = 90, -34
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:5000] echo "LINK: $(nmcli -t -f STATE general 2>/dev/null | tr a-z A-Z)"
    color = $cyan_dim
    font_size = 14
    font_family = $hud
    position = -190, -34
    halign = right
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $cyan_dim
    font_size = 14
    font_family = $hud
    position = -90, -34
    halign = right
    valign = top
    zindex = 2
}

# ── clock column ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:150] gits-lock-clock ghost
    color = rgba(229, 67, 43, 0.85)
    font_size = 112
    font_family = $hud ExtraBold
    position = 92, 167
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:150] gits-lock-clock
    color = $cyan
    font_size = 112
    font_family = $hud ExtraBold
    position = 84, 170
    halign = left
    valign = center
    zindex = 3
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%Y.%m.%d  //  %A' | tr a-z A-Z)"
    color = $cyan_dim
    font_size = 15
    font_family = $hud
    position = 92, 88
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:130] gits-lock-scan
    color = $cyan
    font_size = 14
    font_family = $hud
    position = 92, 44
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:500] gits-lock-prompt
    color = $cyan
    font_size = 14
    font_family = $hud
    position = 92, 8
    halign = left
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 330, 46
    outline_thickness = 1
    rounding = 0
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    hide_input = false
    outer_color = $cyan
    inner_color = $navy
    font_color = $cyan
    check_color = rgba(59, 116, 208, 1.0)
    fail_color = $red
    capslock_color = $orange
    font_family = $hud
    placeholder_text = <span foreground="##2ed3d799">▮ ENTER PASSPHRASE</span>
    fail_text = <span foreground="##e5432b">ACCESS DENIED  [$ATTEMPTS]</span>
    position = 92, -50
    halign = left
    valign = center
    zindex = 2
}

label {
    monitor =
    text = 󰌌  LAYOUT  $LAYOUT[EN,RU]
    color = $cyan_dim
    font_size = 13
    font_family = $hud
    position = 92, -104
    halign = left
    valign = center
    zindex = 2
}

# ── bottom strip ────────────────────────────────────────────────
label {
    monitor =
    text = USER://$USER   ·   SESSION LOCKED
    color = $cyan_dim
    font_size = 13
    font_family = $hud
    position = 90, 34
    halign = left
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] echo "UPTIME $(uptime -p | sed 's/^up //' | tr a-z A-Z)"
    color = $cyan_dim
    font_size = 13
    font_family = $hud
    position = -90, 34
    halign = right
    valign = bottom
    zindex = 2
}

# ── the mascot (the dancing Fuchikoma in colour, else a turning Tachikoma hologram; GITS_LOCK_MASCOT=lain for the dancing Lain, off for none):
#    text frames (colour ones are Pango markup), refreshed 10 times a second (an image widget cannot: it reloads once a second at best) ──
label {
    monitor =
    text = cmd[update:100] gits-lock-mascot
    color = rgba(94, 241, 245, 1.0)
    font_size = 13
    font_family = $hud
    position = -70, 60
    halign = right
    valign = bottom
    zindex = 3
}
