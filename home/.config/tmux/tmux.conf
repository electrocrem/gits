# Ghost in the Shell for tmux: same strip as waybar / the prompt: flat navy-black bar, cyan "active tab", red eye for prefix.
# Palette = ~/.config/hyde/themes/Ghost in the Shell/kitty.theme
# Reload with  prefix + r

# ── behaviour ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-kitty:usstyle,xterm-kitty:hyperlinks"
set -g allow-passthrough on
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on   # one session per kitty window (tmux.zsh): closing it closes the window

# copy: mouse drag selects and copies to the system clipboard on release (wl-copy; OSC 52 is the fallback via set-clipboard);
# prefix + [ = copy mode, v = start selection, y = copy, q = leave; prefix + ] pastes the tmux buffer.
# Shift + drag bypasses tmux and uses kitty's own selection (ctrl+shift+c / ctrl+shift+v).
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind P run-shell "wl-paste -n | tmux load-buffer - && tmux paste-buffer"   # paste the SYSTEM clipboard

bind r source-file ~/.config/tmux/tmux.conf \; display-message "▶ reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── colours ──────────────────────────────────────────────────────────────────
#   bg #060A14  surface #0C1A33  line #254F5D  fg #C8F4FF  dim #9FC5D6  muted #596977
#   cyan #2ED3D7  cyan-hi #5EF1F5  red #E5432B  yellow #E8C547

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#060A14,fg=#9FC5D6"

# left: ┌─[ session ]   (turns into a red ● while the prefix key is armed)
set -g status-left-length 40
set -g status-left "#[fg=#254F5D]┌─[ #{?client_prefix,#[fg=#E5432B]●#[fg=#5EF1F5] ,}#[fg=#5EF1F5,bold]#S#[nobold,fg=#254F5D] ]─"

# right: host │ clock
set -g status-right-length 60
set -g status-right "#[fg=#254F5D]─[ #[fg=#9FC5D6]#H #[fg=#254F5D]│ #[fg=#2ED3D7]%H:%M #[fg=#254F5D]]─┐"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#596977] #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=#060A14,bg=#2ED3D7,bold] #I:#W#{?window_flags,#{window_flags}, } #[default]"
setw -g window-status-activity-style "fg=#E8C547"
setw -g window-status-bell-style "fg=#E5432B,bold"

# panes: thin single lines, active one lit in cyan
set -g pane-border-lines single
set -g pane-border-style "fg=#254F5D"
set -g pane-active-border-style "fg=#2ED3D7"
set -g pane-border-status off
set -g display-panes-colour "#254F5D"
set -g display-panes-active-colour "#E5432B"

# messages, command prompt, menus, copy mode
set -g message-style "bg=#0C1A33,fg=#5EF1F5"
set -g message-command-style "bg=#0C1A33,fg=#E8C547"
set -g mode-style "bg=#254F5D,fg=#DDF9FF"
set -g menu-style "bg=#0A1226,fg=#C8F4FF"
set -g menu-selected-style "bg=#2ED3D7,fg=#060A14,bold"
set -g menu-border-style "fg=#2ED3D7"
set -g menu-border-lines single
set -g popup-border-style "fg=#2ED3D7"
set -g popup-border-lines single
setw -g clock-mode-colour "#2ED3D7"
setw -g clock-mode-style 24
