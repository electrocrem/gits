# GitS battery policy (installed by ~/.local/share/gits-power/setup.sh). The battery is small and worn: 2 % (the
# default action level) lasts well under a minute, so act early.
[UPower]
UsePercentageForPolicy=true
PercentageLow=25.0
PercentageCritical=12.0
PercentageAction=8.0
CriticalPowerAction=PowerOff
